name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kebap-fusion-bite.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kebap-fusion-bite-apk
          path: kebap-fusion-bite.apk

      # On main, publish the APK to a fixed "latest" release so it can be downloaded
      # straight from a phone: /releases/download/latest/kebap-fusion-bite.apk
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest kebap-fusion-bite.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Son test sürümü" \
            --notes "Otomatik derleme: $GITHUB_SHA"
